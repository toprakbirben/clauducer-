name: Build plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # macOS only: the plugin ships as AU/VST3/Standalone on Mac and has never
    # been built on Linux or Windows.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # CMakeLists.txt lives in plugin/, not the repo root. JUCE is fetched by
    # CMake itself (FetchContent), so there's nothing else to install.
    - name: Configure CMake
      run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j 4
